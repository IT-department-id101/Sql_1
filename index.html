.container{padding-bottom:80px}

.pin-wrap.show{display:flex}

function lockScheduleExpiry(expiresAtMillis){
 if(lockExpireTimer){clearInterval(lockExpireTimer);lockExpireTimer=null;}
 if(!expiresAtMillis)return;
 lockExpireTimer=setInterval(()=>{
  if(Date.now()>=expiresAtMillis)lockForceOut('❌ کۆدەکە بەسەرچوو، داوای کۆدێکی نوێ بکە');
 },1000);
}
function lockWatch(code,expiresAtMillis){
 if(lockLiveUnsub)lockLiveUnsub();
 lockScheduleExpiry(expiresAtMillis);
 lockLiveUnsub=db.collection('accessCodes').doc(code).onSnapshot(
  snap=>{
   if(!snap.exists){lockForceOut('❌ مۆڵەتی چوونەژوورەوەت لابرا');return;}
   const d=snap.data();
   const exp=d.expiresAt?d.expiresAt.toMillis():null;
   if(exp&&exp<Date.now())lockForceOut('❌ کۆدەکە بەسەرچوو، داوای کۆدێکی نوێ بکە');
   else lockScheduleExpiry(exp);
  },
  ()=>{}
 );
}

 Console.ReadLine();\nConsole.WriteLine(\"City is: \" + city);","o":"Enter your city:\nHalabja\nCity is: Halabja","intro":"سەرەتا بە <code>Console.WriteLine</code> دەقی Enter your city: چاپ کرد. دواتر بە <code>Console.ReadLine</code> ئەوەی بەکارهێنەر دەینووسێت وەرگرت و خستمانە ناو گۆڕاوی <code>city</code>ی جۆری <code>string</code>. لە کۆتاییدا بە <code>Console.WriteLine</code> دەقی City is: لەگەڵ ئەو شارە بەستمانەوە و چاپمان کرد.","s":[["Console.WriteLine(\"Enter your city:\");","دەقی Enter your city: چاپ دەکات.",[]],["string city = Console.ReadLine();","ئەوەی بەکارهێنەر دەینووسێت دەخوێنێتەوە و دەیخاتە ناو <code>city</code>.",["city = \"Halabja\""]],["Console.WriteLine(\"City is: \" + city);","دەقەکە لەگەڵ ناوی شارەکە دەبەستێتەوە و چاپی دەکات.",[]]],"sum":"پوختە: <code>ReadLine</code> هەمیشە دەق دەگەڕێنێتەوە."}];
function moreHtml(k){const m=MORE[k];if(!m)return '';const L=m.c.split('\n'),map={};let cur=0;
 m.s.forEach(([sn,tx,st])=>{for(let q=cur;q<L.length;q++){if(L[q].trim()===sn){map[q]=[tx,st||[]];cur=q+1;break;}}});
 const cards=L.map((l,i)=>{const t=l.trim();const d=map[i]||[t==='{'?'دەستپێکی بلۆکی کۆد؛ کۆدەکانی دوای ئەمە ئەندامی ئەم بلۆکەن.':t==='}'?'کۆتایی بلۆکی کۆد؛ بلۆکەکە دادەخات.':'—',[]];
  return `<div class="st"><div class="st-h"><span class="rng">هێڵی ${i+1}</span><b class="sn${t.length>=25?' xs':t.length>13?' sm':''}">${esc(t)}</b></div><p>${fx(d[0])}</p>${d[1].length?`<div class="st-v"><span>بەهاکان دوای ئەم هێڵە:</span>${d[1].map(v=>`<i class="vs">${v}</i>`).join('')}</div>`:''}</div>`;}).join('');
 return `<button class="more-btn" onclick="toggleMore(${k},this)">ڕوونکردنەوەی زیاتر 📖</button>
<div class="more-panel" id="more${k}"><div class="more-title">ڕوونکردنەوەی زیاتر — بە نموونەیەکی نوێ</div>
<div class="code-box"><div class="line-numbers">${L.map((_,i)=>`<span>${i+1}</span>`).join('')}</div><div class="code-content"><pre>${L.map(hl).join('\n')}</pre></div></div>
<div class="output-box"><div class="output-header">:دەرەنجام &nbsp;|&nbsp; Output:</div><div class="output-content">${esc(m.o)}</div></div>
<div class="walk"><span class="wl">کارەکەی ئەم کۆدە بە کورتی:</span>${fx(m.intro)}</div>
${cards}<p class="more-sum">${fx(m.sum)}</p></div>`;}

views.innerHTML=`<div class="content active"><div class="intro"><h2>🎯 بەخێربێیت</h2><p>لێرەدا <b>${n(E.length)} نموونە</b>ی C# دەبینیت لە PDF ـەکەوە، لە پەڕەی ١ تا ١٧.</p><p>هەر نموونەیەک: سەردێڕ، کۆد لەگەڵ ژمارەی هێڵ، دەرەنجام و ڕوونکردنەوە.</p><p style="font-weight:bold;color:#667eea">دوگمەکانی سەرەوە هەڵبژێرە 👆</p>
<div class="fb-box"><div class="fb-title">✉️ دروستکەری ماڵپەڕ</div><div class="fb-sub">پێشنیار و ڕخنەت هەیە؟ بینێرە بۆ دروستکەری ماڵپەڕ.<br>کۆدی تایبەت بە تۆ: <b style="color:#5b21b6">${fbVisitorCode()}</b> بەم کۆدە دەناسرێنەوە "بیرتان نەچێ دووعای خێر"</div>
<div class="fb-quick"><button class="fb-qbtn" onclick="fbFill('thanks')">🙏 سپاسگوزاری</button><button class="fb-qbtn" onclick="fbFill('suggest')">💡 پێشنیار</button></div>
<textarea class="fb-area" id="fbText" placeholder="نامەکەت لێرە بنووسە، یان یەکێک لە دوگمەکانی سەرەوە هەڵبژێرە..."></textarea>
<button class="fb-send" id="fbSendBtn" onclick="fbSendDirect()">📤 ناردنی نامە بە شێوەی ڕاستەوخۆ</button>

<div class="fb-msg" id="fbMsg"></div></div>
</div></div>`+
E.map((e,k)=>{const L=e.c.split('\n');
return `<div class="content"><div class="example"><div class="title-row"><div class="example-title">${e.t}</div><span class="pdf-page">${e.p}</span></div>
<div class="code-box"><div class="line-numbers">${L.map((_,i)=>`<span>${i+1}</span>`).join('')}</div><div class="code-content"><pre>${L.map(hl).join('\n')}</pre></div></div>
<div class="output-box"><div class="output-header">:دەرەنجام &nbsp;|&nbsp; Output:</div><div class="output-content">${esc(e.o)}</div></div>
<div class="expl-box"><div class="expl-title">📚 ڕوونکردنەوە:</div><div class="walk"><span class="wl">کارەکەی ئەم کۆدە بەم شێوەیە:</span>${fx(EXSUM[k])}</div><ul>${expl(e,EX[k])}</ul></div>${moreHtml(k)}</div></div>`}).join('');
let curTab=0,inMore=false;const PS=[{on:false,wide:false,lp:false,t:null,w:'pinWrap',x:'pinTxt'},{on:false,wide:false,lp:false,t:null,w:'pinWrap2',x:'pinTxt2'}];
let HS=0;
function pinLabel(q){if(!q.on)return HS===0?'ئایکۆنەکە بگرە و ڕایکێشە بۆ دەستی ڕاست ➡️':'pin';if(q.wide)return HS===1?'ئێستا ڕایکێشە بۆ سەرەوە ⬆️':'pinned · full';return 'pinned';}
function pinBox(n){const c=document.querySelectorAll('.content')[curTab];return c&&c.querySelector(n?'#more'+(curTab-1)+' .code-box':'.example > .code-box');}
function pinApply(n){const q=PS[n],w=document.getElementById(q.w);w.classList.toggle('on',q.on);w.classList.toggle('full',q.on&&q.wide);w.classList.toggle('dock',!!q.dock);document.getElementById(q.x).textContent=pinLabel(q);pinSync();}
function pinFree(b){b.classList.remove('pinned','wide');b.style.left='';b.style.width='';b.style.top='';if(b._sp){b._sp.remove();b._sp=null;}}
function pinSync(){const w1=document.getElementById('pinWrap'),w2=document.getElementById('pinWrap2');
 if(curTab<1){w1.classList.remove('show');w2.classList.remove('show');[0,1].forEach(n=>{const b=pinBox(n);if(b)pinFree(b);});return;}
 const m=document.getElementById('more'+(curTab-1));inMore=false;
 if(m&&m.classList.contains('open')){const r=m.getBoundingClientRect();inMore=r.top<window.innerHeight*0.55&&r.bottom>120;}
 const b0=pinBox(0);let mainIn=false;if(b0&&b0.parentNode){const nr=(b0._sp||b0).getBoundingClientRect(),pr=b0.parentNode.getBoundingClientRect();mainIn=nr.top<window.innerHeight*0.6&&pr.bottom>200;}
 w1.classList.toggle('show',mainIn&&!inMore);w2.classList.toggle('show',inMore);
 [0,1].forEach(n=>{const q=PS[n],b=pinBox(n);if(!b)return;const cont=n?m:b.parentNode;
  if(!cont||(n&&!m.classList.contains('open'))){pinFree(b);return;}
  const nat=(b._sp||b).getBoundingClientRect(),cr=cont.getBoundingClientRect(),want=q.on&&(n?inMore:!inMore);
  if(want&&nat.top<0&&cr.bottom>0){
   if(!b._sp){const sp=document.createElement('div');sp.className='pin-spacer';sp.style.height=(b.offsetHeight+18)+'px';b.parentNode.insertBefore(sp,b);b._sp=sp;}
   b.classList.add('pinned');b.classList.toggle('wide',q.wide);
   const sr=b._sp.getBoundingClientRect();if(q.wide){b.style.left='';b.style.width='';}else{b.style.left=sr.left+'px';b.style.width=sr.width+'px';}
   b.style.top=Math.min(0,cr.bottom-b.offsetHeight)+'px';}
  else pinFree(b);});
 document.body.style.paddingTop='20px';}
function pinClick(n){const q=PS[n];if(q.lp){q.lp=false;return;}if(q.dock){q.dock=false;pinApply(n);return;}q.on=!q.on;if(!q.on)q.wide=false;pinApply(n);}
function pinDown(n,e){const q=PS[n];q.lp=false;q.mv=false;q.dir='';clearTimeout(q.t);q.x0=e.clientX;q.y0=e.clientY;q.dr=true;
 try{e.currentTarget.setPointerCapture(e.pointerId);}catch(_){}
 q.t=setTimeout(()=>{q.lp=true;q.dr=false;q.dock=false;if(!q.on){q.on=true;q.wide=true;}else q.wide=!q.wide;if(HS===0&&q.on&&q.wide)HS=1;pinApply(n);if(navigator.vibrate)navigator.vibrate(40);},700);}
function pinMove(n,e){const q=PS[n];if(!q.dr)return;const dx=e.clientX-q.x0,dy=e.clientY-q.y0;
 if(Math.abs(dx)<10&&Math.abs(dy)<10)return;
 clearTimeout(q.t);q.mv=true;
 const b=e.currentTarget,w=document.getElementById(q.w),tx=document.getElementById(q.x);
 q.dir=Math.abs(dx)>=Math.abs(dy)?(dx>40?'r':''):(dy>40?'d':(dy<-40?'u':''));
 b.classList.add('drag');b.style.transform='translate('+Math.max(0,Math.min(50,dx))+'px,'+Math.max(-50,Math.min(50,dy))+'px)';
 w.querySelector('.pin-pill').classList.toggle('hint',!!q.dir);
 tx.textContent=q.dir==='r'?'→ pinned · full':q.dir==='d'?'↓ pinned':q.dir==='u'?'↑ dock':(q.on?(q.wide?'pinned · full':'pinned'):'pin');}
function pinUp(n,e){const q=PS[n];clearTimeout(q.t);if(!q.dr)return;q.dr=false;
 const b=e.currentTarget;b.classList.remove('drag');b.style.transform='';
 document.getElementById(q.w).querySelector('.pin-pill').classList.remove('hint');
 if(q.mv){q.lp=true;if(q.dir==='u'){if(HS===1)HS=2;q.dock=true;if(navigator.vibrate)navigator.vibrate(30);}else if(q.dir==='r'){if(HS===0)HS=1;q.dock=false;q.on=true;q.wide=true;if(navigator.vibrate)navigator.vibrate(30);}else if(q.dir==='d'){q.dock=false;q.on=true;q.wide=false;if(navigator.vibrate)navigator.vibrate(30);}pinApply(n);}}
function pinReset(){if(curTab>=1)[0,1].forEach(n=>{const b=pinBox(n);if(b)pinFree(b);});PS.forEach(q=>{q.on=false;q.wide=false;document.getElementById(q.w).classList.remove('on','full','dock');q.dr=false;q.dock=false;document.getElementById(q.x).textContent=pinLabel(q);});}
window.addEventListener('scroll',pinSync,{passive:true});window.addEventListener('resize',pinSync);
function showTab(i){pinReset();curTab=i;pinSync();setTimeout(pinSync,450);document.querySelectorAll('.tab').forEach((t,k)=>t.classList.toggle('active',k===i));
 document.querySelectorAll('.content').forEach((c,k)=>c.classList.toggle('active',k===i));
 const el=k=>document.querySelectorAll('.content')[i];
 const t=i===0?null:document.querySelectorAll('.content')[i].querySelector('.title-row');
 if(t)t.scrollIntoView({behavior:'smooth',block:'start'});else window.scrollTo({top:0,behavior:'smooth'});}
